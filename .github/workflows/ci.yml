name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: 代码检查
        run: ruff check kurotutor/ tests/

      - name: 测试
        run: pytest -q
        env:
          # 测试必须离线：禁止读取任何真实密钥/调用外部服务
          KURO_TEST_OFFLINE: "1"
          # 部分测试断言按东八区时间推算，统一时区保证任意 runner 上一致
          TZ: Asia/Shanghai
