[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KuroTutor"
version = "0.7.2"
description = "KuroTutor：QQ 私聊里的 24 小时 AI 私人老师（全科、从零自研、开源 MIT）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KuroTutor Contributors" }]
keywords = ["tutor", "agent", "qq", "education", "ai"]

dependencies = [
    "sqlmodel>=0.0.21",
    "pydantic>=2.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "numpy>=1.26", "pillow>=10.0"]
dev = ["ruff>=0.5", "mypy>=1.10"]
# 官方 QQ 机器人 SDK（tencent-connect/botpy）。不在 PyPI，需从 GitHub 安装：
#   pip install git+https://github.com/tencent-connect/botpy.git
qq = ["botpy"]

[project.scripts]
kuro = "kurotutor.cli.main:app"

[project.urls]
Homepage = "https://github.com/ZYT64/KuroTutor"

[tool.setuptools.packages.find]
include = ["kurotutor*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts"]  # 一次性脚本/评测驱动不参与 lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer 命令行必须用 typer.Option(...)/typer.Argument(...) 作为参数默认值（B008 误报）；
# 循环变量若未用，可用下划线（B007）。此处统一豁免 CLI 目录，保持代码可读。
"kurotutor/cli/**" = ["B008"]
"tests/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
